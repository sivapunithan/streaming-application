spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: streaming-service

  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: streaming-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          json:
            trusted:
              packages: '*'
            use:
              type:
                headers: false
            value:
              default:
                type: com.streaming.streamingservice.event.VideoEncodedEvent
server:
  port: 8084

app:
  base-url: ${APP_BASE_URL:http://localhost:8084}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

#AWS Configuration
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    presigned-url-expiry: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info